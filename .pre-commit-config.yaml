fail_fast: true
repos:
- repo: local
  hooks:

    - id: pyink
      name: pyink
      entry: poetry run pyink
      language: system
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/Dockerfile'

    - id: isort
      name: isort
      entry: poetry run isort
      language: system
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/proto/'

    # NOTE: running `pylint` against all files is prohibitively slow
    # ... so we omit passing the `smart_buildings` directory,
    # ... which allows pre-commit to run against staged / changed files only
    - id: pylint
      name: pylint
      #entry: pylint --rcfile=.pylintrc --ignore=proto smart_control
      #entry: pylint --rcfile=.pylintrc --ignore=proto $(git diff --name-only --staged | grep -E '\.py$')
      entry: pylint --rcfile=.pylintrc --ignore=proto
      language: system
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/proto/'

    # TODO(#174): Make this blocking after the upcoming internal code sync
    # resolves existing Pyrefly findings in smart_control.
    - id: pyrefly
      name: pyrefly
      entry: >-
        python -c "import subprocess; subprocess.run(['poetry', 'run',
        'pyrefly', 'check', '--config', 'pyrefly.toml'])"
      language: system
      pass_filenames: false
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/proto/'
      verbose: true

# See: https://mdformat.readthedocs.io/en/stable/users/installation_and_usage.html#usage-as-a-pre-commit-hook
- repo: https://github.com/hukkin/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-mkdocs==5.3.0
