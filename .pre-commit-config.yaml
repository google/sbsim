fail_fast: true
repos:
- repo: local
  hooks:

    - id: pyink
      name: pyink
      entry: poetry run pyink
      language: system
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/Dockerfile'

    - id: isort
      name: isort
      entry: poetry run isort
      language: system
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/proto/'

    - id: pyrefly
      name: pyrefly
      entry: pyrefly check
      language: system
      types: [file, python]
      files: '^smart_control/'
      exclude: '^smart_control/proto/'

# See: https://mdformat.readthedocs.io/en/stable/users/installation_and_usage.html#usage-as-a-pre-commit-hook
- repo: https://github.com/hukkin/mdformat
  rev: 0.7.22
  hooks:
  - id: mdformat
    exclude: ^docs/api/
