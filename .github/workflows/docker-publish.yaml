# Publish the sbsim container image when a GitHub release is published.
#
# Required configuration
# ----------------------
# No repository secrets are required for the GitHub Container Registry (GHCR)
# publish. The workflow authenticates with the automatically provided
# `GITHUB_TOKEN` and the `packages: write` permission declared below.
#
# Repository administrators should verify that Actions can create packages and
# that the published package is visible to end users. New packages are private
# by default; set `ghcr.io/google/sbsim` to public under the package settings if
# anonymous pulls should be allowed. See:
# - https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
# - https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility
#
# Optional Docker Hub publishing
# ------------------------------
# To also publish `<username>/sbsim` to Docker Hub, configure both repository
# secrets under Settings > Secrets and variables > Actions > Secrets:
# - DOCKER_HUB_USERNAME: Docker Hub username that owns the target repository.
# - DOCKER_HUB_PASSWORD: Docker Hub access token (not the account password)
#   with permission to push to the target repository.
# If either secret is unset, the Docker Hub steps are skipped and only GHCR is
# published. See:
# - https://docs.docker.com/security/for-developers/access-tokens/
# - https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions
#
# Workflow environment variables
# ------------------------------
# - REGISTRY: registry host for the required GHCR publish (`ghcr.io`).
# - IMAGE_NAME: image path within the registry (`github.repository`, which is
#   `google/sbsim` for this repository).
# - DOCKER_HUB_USERNAME and DOCKER_HUB_PASSWORD: optional secrets mapped to
#   environment variables so the Docker Hub steps can be skipped when they are
#   not configured. Values are masked by GitHub Actions and are never printed.
#
# Image tags
# ----------
# - Release published: `latest`, the release tag, and, for semantic version
#   tags such as `v1.2.3`, `1.2.3` and `1.2`. Non-semver release tags (for
#   example `pre-sync-20250521`) still publish the release tag and `latest`.
# - Manual workflow run: the optional `tag` input, or `sha-<short sha>` when no
#   tag is provided.
#
# This workflow only reads repository contents and writes packages. It does not
# modify releases or any other repository state.
name: Docker Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the published image (defaults to sha-<short sha>)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag,enable=${{ github.event_name == 'release' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

    - name: Build and push to the GitHub Container Registry
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=ghcr
        cache-to: type=gha,mode=max,scope=ghcr

    - name: Log in to Docker Hub
      if: ${{ env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_PASSWORD != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ env.DOCKER_HUB_USERNAME }}
        password: ${{ env.DOCKER_HUB_PASSWORD }}

    - name: Extract Docker Hub metadata
      id: meta-dockerhub
      if: ${{ env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_PASSWORD != '' }}
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.DOCKER_HUB_USERNAME }}/sbsim
        tags: |
          type=ref,event=tag,enable=${{ github.event_name == 'release' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

    - name: Build and push to Docker Hub
      if: ${{ env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_PASSWORD != '' }}
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta-dockerhub.outputs.tags }}
        labels: ${{ steps.meta-dockerhub.outputs.labels }}
        cache-from: type=gha,scope=dockerhub
        cache-to: type=gha,mode=max,scope=dockerhub
