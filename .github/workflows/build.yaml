name: Python CI Build

on:
  push:
    branches:
      - master
      - main
      - copybara_push
  pull_request:
    branches:
      - master
      - main
      - copybara_push

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # there is no 3.10.15 on mac
        # see: https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
        os: [ubuntu-latest]
        python-version: ['3.10.15', '3.11']

        include:
          - os: macos-15-intel # updated intel-based
            python-version: '3.11'

          - os: macos-latest # arm-based
            python-version: '3.11'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (on Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y protobuf-compiler ffmpeg

    - name: Install system dependencies (on Mac)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install protobuf@21 ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m venv .venv
        source .venv/bin/activate
        pip install poetry==2.1.2
        poetry install --with dev

    - name: Run the Python formatter
      run: |
        source .venv/bin/activate
        pyink .

    - name: Run the Python import sorter
      run: |
        source .venv/bin/activate
        isort .

    - name: Run the Python style checker
      run: |
        source .venv/bin/activate
        pylint --rcfile=.pylintrc --ignore=proto smart_control

    - name: Run the Python type checker
      run: |
        source .venv/bin/activate
        # TODO(#174): Remove "|| true" after the upcoming internal code sync
        # resolves existing Pyrefly findings in smart_control.
        pyrefly check --config pyrefly.toml || true

    - name: Run the Markdown formatter
      run: |
        source .venv/bin/activate
        mdformat README.md docs --check

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest --disable-pytest-warnings
