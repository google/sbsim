name: Docker Build

on:
  push:
    branches:
      - master
      - main
      - copybara_push
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build.yaml'
  pull_request:
    branches:
      - master
      - main
      - copybara_push
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build.yaml'

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: sbsim:ci-build
        cache-from: type=gha
        cache-to: type=gha,mode=max